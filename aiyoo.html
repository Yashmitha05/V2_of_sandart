<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Still — a quiet place to make and let go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@property --bg1 { syntax: '<color>'; inherits: true; initial-value: #1b1730; }
@property --bg2 { syntax: '<color>'; inherits: true; initial-value: #0b0a15; }
:root{
  --bg1:#1b1730; --bg2:#0b0a15; --accent:#f0c9a8;
  --glass:rgba(18,16,30,.42); --glass-border:rgba(255,255,255,.08);
  --text:rgba(255,255,255,.9); --muted:rgba(255,255,255,.52);
  --ease:cubic-bezier(.22,.8,.24,1);
  transition:--bg1 1.8s var(--ease), --bg2 1.8s var(--ease);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 20%, var(--bg1) 0%, var(--bg2) 72%);
  font-family:'Inter',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

.layer{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity 1s var(--ease)}
.layer.active{opacity:1}
.layer canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#sand{position:fixed!important;width:auto;height:auto;image-rendering:crisp-edges;image-rendering:pixelated}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:none}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.5) 100%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.brush{position:fixed;left:0;top:0;z-index:20;pointer-events:none;border-radius:50%;border:1px solid rgba(255,255,255,.6);
  mix-blend-mode:difference;opacity:0;transition:width .3s var(--ease),height .3s var(--ease),opacity .4s}
.brush::after{content:'';position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#fff}
.brush.show{opacity:1}

.brand{position:fixed;top:26px;left:30px;z-index:30;transition:opacity .8s var(--ease)}
.brand h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:27px;letter-spacing:.05em}
.brand p{margin-top:6px;max-width:300px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;line-height:1.35;color:var(--muted);transition:opacity .25s}
.brand p.fade{opacity:0}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  border:1px solid var(--glass-border);box-shadow:0 24px 60px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:4px;padding:6px;border-radius:22px;
  max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;transition:opacity .8s var(--ease)}
.dock::-webkit-scrollbar{display:none}
.tabs{position:fixed!important;top:20px;left:50%;transform:translateX(-50%);z-index:30;border-radius:20px!important;padding:4px!important;transition:opacity .8s var(--ease)}
.btn{appearance:none;border:0;background:transparent;color:var(--muted);height:38px;min-width:38px;padding:0 11px;border-radius:14px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font:500 12.5px/1 'Inter',sans-serif;letter-spacing:.02em;white-space:nowrap;cursor:pointer;
  transition:color .3s,background .3s,transform .2s,box-shadow .2s}
.btn:hover{color:var(--text);background:rgba(255,255,255,.06)}
.btn:active{transform:scale(.95)}
.btn.on{color:var(--accent)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;overflow:visible}
.btn svg .f{fill:currentColor;stroke:none}
#gravIcon{transform-origin:12px 12px;transition:transform .6s var(--ease)}
.seg{position:relative;display:flex;padding:3px;border-radius:17px;background:rgba(255,255,255,.035);flex-shrink:0}
.seg .btn{position:relative;z-index:1;height:34px}
.seg .btn:hover{background:transparent}
.seg .btn.active{color:#fff}
.glider{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 16px -8px rgba(0,0,0,.6);transition:transform .55s var(--ease),width .55s var(--ease)}
.tabs .glider{top:4px;bottom:4px}
.sep{width:1px;height:22px;background:rgba(255,255,255,.08);margin:0 4px;flex-shrink:0}
.ctx{display:none;align-items:center;gap:4px;flex-shrink:0}
.ctx.show{display:flex;animation:ctxIn .5s var(--ease)}
@keyframes ctxIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.size{display:flex;align-items:center;gap:9px;padding:0 10px;height:38px;flex-shrink:0;color:var(--muted)}
.size .dot-s{width:4px;height:4px;border-radius:50%;background:currentColor}
.size .dot-l{width:9px;height:9px;border-radius:50%;background:currentColor}
.size input{-webkit-appearance:none;appearance:none;width:84px;height:3px;border-radius:3px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,rgba(255,255,255,.6) var(--p,25%),rgba(255,255,255,.12) var(--p,25%))}
.size input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#f4ece2;box-shadow:0 0 0 4px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.5)}
.size input::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#f4ece2}
.swatch{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 0 14px -2px var(--accent)}
.worry{display:flex;align-items:center;gap:4px}
.worry input{height:34px;width:210px;border:0;outline:none;border-radius:12px;padding:0 13px;background:rgba(255,255,255,.05);color:var(--text);
  font:italic 400 16px 'Cormorant Garamond',serif;transition:background .3s;user-select:text;-webkit-user-select:text}
.worry input:focus{background:rgba(255,255,255,.09)}
.worry input::placeholder{color:rgba(255,255,255,.38)}

body.immersed .dock,body.immersed .brand,body.immersed .tabs{opacity:.15}
body.ui-hidden .dock,body.ui-hidden .brand,body.ui-hidden .tabs,body.ui-hidden .panel{opacity:0!important;pointer-events:none}

.panel{position:fixed;left:50%;bottom:84px;z-index:31;transform:translate(-50%,10px);opacity:0;pointer-events:none;
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border-radius:20px;width:min(430px,calc(100vw - 24px));transition:opacity .4s var(--ease),transform .4s var(--ease)}
.panel.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pal{border:0;background:rgba(255,255,255,.03);border-radius:14px;padding:9px;text-align:left;cursor:pointer;color:var(--muted);font:500 12px 'Inter',sans-serif;transition:background .3s,color .3s}
.pal:hover{background:rgba(255,255,255,.07);color:var(--text)}
.pal.active{background:rgba(255,255,255,.1);color:var(--text)}
.pal .bar{height:26px;border-radius:9px;margin-bottom:8px}
.pal small{display:block;margin-top:3px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--muted)}

.breath{position:fixed;top:24px;right:28px;z-index:25;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity 1.2s var(--ease)}
.breath.on{opacity:1}
.breath-ring{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.orb{width:46px;height:46px;border-radius:50%;transform:scale(.5);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.55),var(--accent) 42%,transparent 72%);box-shadow:0 0 40px -6px var(--accent);opacity:.85}
.breath-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;letter-spacing:.05em;color:var(--muted);transition:opacity .3s;min-width:90px}

.toast{position:fixed;left:50%;bottom:90px;z-index:40;transform:translate(-50%,8px);opacity:0;pointer-events:none;white-space:nowrap;padding:9px 18px;border-radius:999px;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(8,7,14,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:opacity 1.5s var(--ease),visibility 1.5s}
.intro.gone{opacity:0;visibility:hidden}
.intro-inner{text-align:center;max-width:520px;padding:24px;animation:rise 1.8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sandfall{position:relative;width:2px;height:58px;margin:0 auto 30px}
.sandfall i{position:absolute;left:0;top:0;width:2px;height:2px;border-radius:50%;background:var(--accent);opacity:0;animation:fall 2.2s linear infinite}
.sandfall i:nth-child(2){animation-delay:.37s}.sandfall i:nth-child(3){animation-delay:.73s}.sandfall i:nth-child(4){animation-delay:1.1s}.sandfall i:nth-child(5){animation-delay:1.47s}.sandfall i:nth-child(6){animation-delay:1.83s}
.sandfall::after{content:'';position:absolute;bottom:-2px;left:-17px;width:36px;height:9px;border-radius:50% 50% 0 0/100% 100% 0 0;background:var(--accent);opacity:.55}
@keyframes fall{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(52px);opacity:0}}
.intro h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(46px,9vw,72px);letter-spacing:.02em;line-height:1}
.intro .lead{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:rgba(255,255,255,.66);margin:16px 0 14px;line-height:1.4}
.intro .spaces{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:10px}
.intro .senses{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:rgba(255,255,255,.5);margin-bottom:32px}
.intro-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.primary,.ghost{height:46px;padding:0 26px;border-radius:999px;font:500 14px 'Inter',sans-serif;cursor:pointer;transition:transform .25s var(--ease),box-shadow .3s,background .3s}
.primary{border:0;background:#f2e8db;color:#1a1626;box-shadow:0 12px 34px -12px rgba(242,232,219,.55)}
.primary:hover{transform:translateY(-1px)}
.ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.15)}
.ghost:hover{color:var(--text);background:rgba(255,255,255,.05)}
.keys{margin-top:36px;font-size:11.5px;color:rgba(255,255,255,.36);letter-spacing:.03em;line-height:2.1}
kbd{font:500 10.5px 'Inter',sans-serif;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.6)}

/* ---------- v2 additions ---------- */
[hidden]{display:none!important}
.btn:focus-visible,.chip:focus-visible,.primary:focus-visible,.ghost:focus-visible,.switch:focus-visible,.pal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand p{max-width:260px}
.breath{top:80px}
.breath-text small{display:block;margin-top:3px;min-height:12px;font:500 10px 'Inter',sans-serif;letter-spacing:.2em;color:rgba(255,255,255,.35)}
.util{position:fixed;top:20px;right:20px;z-index:30;display:flex;align-items:center;gap:2px;padding:4px;border-radius:20px;transition:opacity .8s var(--ease)}
.util .btn{height:36px;min-width:36px;padding:0 9px}
.btn svg .arc{stroke:var(--accent);stroke-width:2;transition:stroke-dashoffset .6s linear}
.tlbl{font-variant-numeric:tabular-nums;color:var(--accent);font-size:12px}
.tlbl:empty{display:none}
.dock{animation:dockIn 1s var(--ease) backwards .2s}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.bloom{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(60% 60% at 50% 50%,var(--accent),transparent 70%);mix-blend-mode:soft-light;transition:opacity 2.2s var(--ease)}
body.glow .bloom{opacity:.6}
body.no-hints .brand p{opacity:0!important}
body.no-grain .grain{display:none}
body.idle .dock,body.idle .tabs,body.idle .brand,body.idle .util{opacity:0;pointer-events:none}
body.immersed .util{opacity:.15}
body.ui-hidden .util{opacity:0!important;pointer-events:none}
body.dreaming .dock,body.dreaming .tabs,body.dreaming .brand,body.dreaming .util,body.dreaming .panel,body.dreaming .brush{opacity:0!important;pointer-events:none}

.pop{position:fixed;z-index:45;border-radius:20px;padding:16px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
#timerPop{top:72px;right:20px;width:276px}
.pop h3,.drawer h3,.keys-title{font:italic 400 20px/1.2 'Cormorant Garamond',serif;color:var(--text);margin-bottom:12px;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;height:32px;padding:0 14px;font:500 12.5px 'Inter',sans-serif;cursor:pointer;transition:color .25s,background .25s,border-color .25s,transform .2s}
.chip:hover{color:var(--text);background:rgba(255,255,255,.09)}
.chip:active{transform:scale(.96)}
.chip.active{color:#16131f;background:var(--accent);border-color:transparent}
.chip.stop{margin-top:12px;width:100%}

.scrim{position:fixed;inset:0;z-index:48;background:rgba(5,4,10,.35);opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;z-index:50;width:min(390px,calc(100vw - 24px));border-radius:26px;padding:16px 18px 22px;overflow-y:auto;overscroll-behavior:contain;
  transform:translateX(calc(100% + 30px));transition:transform .6s var(--ease);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent;background:rgba(16,14,26,.72)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.drawer section{padding:16px 2px;border-top:1px solid rgba(255,255,255,.06)}
.drawer section:first-child{border-top:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:14px 14px 12px}
.stat b{display:block;font:300 34px/1 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;color:var(--text);margin-bottom:6px}
#breathText{transition:opacity .3s}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.stat.hero{grid-column:span 2;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.stat.hero b{font-size:52px;color:var(--accent)}
.stat.wide{grid-column:span 2;display:flex;align-items:center;justify-content:space-between}
.week{display:flex;gap:6px}
.week i{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.06);font:500 9.5px 'Inter',sans-serif;font-style:normal;color:var(--muted)}
.week i.on{background:var(--accent);color:#16131f;box-shadow:0 0 14px -3px var(--accent)}
.moments{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.moments.none{display:block}
.moment{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.04);cursor:pointer}
.moment img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.moment:hover img{transform:scale(1.07)}
.moment .x{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s}
.moment:hover .x,.moment .x:focus-visible{opacity:1}
.empty{font:italic 16px/1.4 'Cormorant Garamond',serif;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0;font-size:13px;color:var(--text)}
.range{-webkit-appearance:none;appearance:none;width:150px;height:3px;border-radius:3px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) var(--p,50%),rgba(255,255,255,.12) var(--p,50%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#f4ece2;box-shadow:0 0 0 4px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.5)}
.range::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#f4ece2}
.switch{position:relative;width:40px;height:23px;border-radius:999px;background:rgba(255,255,255,.12);border:0;cursor:pointer;transition:background .3s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#f4ece2;transition:transform .35s var(--ease),background .3s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(17px);background:#16131f}

.tip{position:fixed;left:0;top:0;z-index:80;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;
  font:500 11.5px 'Inter',sans-serif;color:var(--text);white-space:nowrap;opacity:0;transform:translateY(3px);transition:opacity .18s,transform .18s;background:rgba(16,14,26,.85)}
.tip.show{opacity:1;transform:none}
.tip kbd{font-size:10px}

.modal{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:14vh 12px 0;background:rgba(5,4,10,.45);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{width:min(580px,100%);border-radius:22px;overflow:hidden;background:rgba(16,14,26,.8);transform:translateY(-10px) scale(.98);transition:transform .4s var(--ease)}
.modal.open .modal-card{transform:none}
.cmd-input{width:100%;height:60px;border:0;outline:none;background:transparent;color:var(--text);padding:0 22px;font:italic 400 22px 'Cormorant Garamond',serif;
  border-bottom:1px solid rgba(255,255,255,.07);user-select:text;-webkit-user-select:text}
.cmd-input::placeholder{color:rgba(255,255,255,.35)}
.cmd-list{max-height:min(52vh,440px);overflow-y:auto;padding:6px;scrollbar-width:thin}
.cmd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:12px;font-size:13.5px;color:var(--muted);cursor:pointer}
.cmd.sel{background:rgba(255,255,255,.08);color:var(--text)}
.cmd small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3)}
.keys-title{padding:22px 24px 0}
.keys-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;padding:6px 24px 24px}
.keys-grid div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}

.intro .greet{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);opacity:.85;margin-bottom:14px;min-height:14px}
.intro .senses{margin-bottom:16px}
.intro .quote{font:italic 300 18px/1.45 'Cormorant Garamond',serif;color:rgba(255,255,255,.5);margin:0 auto 30px;max-width:420px}
.intro-langs{justify-content:center;margin-top:26px}
.intro-langs .chip{height:28px;padding:0 12px;font-size:11.5px}

@media (max-width:1080px){.tabs .lbl{display:none}}
@media (max-width:680px){
  .lbl{display:none}.brand{display:none}.hide-sm{display:none!important}
  .tabs{top:12px;left:12px;transform:none}.tabs .btn{padding:0 9px}.util{top:12px;right:12px}
  .dock{bottom:12px}.size input{width:60px}.worry input{width:140px}

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

/* =================== Palettes =================== */
const PALETTES = [
  { name:'Dusk',   mood:'warm and slow',  accent:'#f0c9a8', bg:['#1b1730','#0b0a15'], stops:[[258,42,64],[318,45,68],[18,72,70],[38,78,74],[280,35,58]] },
  { name:'Desert', mood:'grounded',       accent:'#e8b98a', bg:['#201812','#0c0806'], stops:[[32,58,72],[18,52,60],[40,62,80],[10,42,48],[28,35,64]] },
  { name:'Tide',   mood:'cool and clear', accent:'#9fd8e6', bg:['#0c1a24','#04090d'], stops:[[192,62,58],[174,48,62],[208,58,74],[226,42,58],[186,30,82]] },
  { name:'Lotus',  mood:'soft and tender',accent:'#f4b8c8', bg:['#22131c','#0b0609'], stops:[[342,58,74],[300,32,76],[18,64,80],[352,42,64],[40,60,86]] },
  { name:'Moss',   mood:'quiet and green',accent:'#c9d9a6', bg:['#0f1a14','#050a07'], stops:[[148,30,52],[92,30,62],[46,46,70],[168,26,42],[70,22,78]] },
  { name:'Aurora', mood:'luminous',       accent:'#a7f0d6', bg:['#0d1220','#04060c'], stops:[[162,68,62],[190,78,64],[268,60,70],[300,52,68],[220,60,66]] },
];
let palette = PALETTES[0];

/* =================== Shared state =================== */
const fx = $('#fx'), fctx = fx.getContext('2d');
const brushEl = $('#brush'), toastEl = $('#toast'), hintEl = $('#hint'), panel = $('#panel');
const orb = $('#orb'), breathText = $('#breathText'), breathEl = $('#breath');
let vw = innerWidth, vh = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
let time = 0, frameNo = 0, activity = 'sand', introDone = false;
const pointer = { x: vw/2, y: vh/2, lx: vw/2, ly: vh/2, bx: vw/2, by: vh/2, down: false, fresh: false, pressure: 1, type: 'mouse' };
let tiltX = 0, tiltY = 1, tiltActive = false;

/* =================== Colour =================== */
function hslToRgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function samplePalette(t) {
  const st = palette.stops, n = st.length;
  const p = (((t % 1) + 1) % 1) * n, i = Math.floor(p), f = p - i;
  const a = st[i], b = st[(i + 1) % n], e = f * f * (3 - 2 * f);
  let dh = b[0] - a[0]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
  return [a[0] + dh * e, a[1] + (b[1] - a[1]) * e, a[2] + (b[2] - a[2]) * e];
}

/* =================== Audio =================== */
let audio = null, soundOn = false;
const SCALE = [220, 246.94, 277.18, 329.63, 369.99, 440, 493.88, 554.37, 659.25, 739.99, 880];
function makeImpulse(ac, dur, decay) {
  const len = Math.floor(ac.sampleRate * dur), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const ch = b.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function createAudio() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  const ac = new AC();
  const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  const conv = ac.createConvolver(); conv.buffer = makeImpulse(ac, 3.5, 2.4);
  const wet = ac.createGain(); wet.gain.value = 0.55; conv.connect(wet); wet.connect(master);
  const pad = ac.createGain(); pad.gain.value = 0.5;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 850; lp.Q.value = 0.3;

    const o = ac.createOscillator(); o.type = i % 2 ? 'sine' : 'triangle'; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 8;
    const g = ac.createGain(); g.gain.value = 0.045;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.03 + Math.random() * 0.05;
    const lg = ac.createGain(); lg.gain.value = 0.035; lfo.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(pad); o.start(); lfo.start();
  });
  const fl = ac.createOscillator(); fl.frequency.value = 0.05;
  const fg = ac.createGain(); fg.gain.value = 320; fl.connect(fg); fg.connect(lp.frequency); fl.start();
  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() < 0.06 ? (Math.random() * 2 - 1) : (Math.random() * 2 - 1) * 0.05;
  const ns = ac.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 0.7;
  const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600;
  const sandGain = ac.createGain(); sandGain.gain.value = 0;
  ns.connect(bp); bp.connect(hp); hp.connect(sandGain); sandGain.connect(master);
  const sw = ac.createGain(); sw.gain.value = 0.3; sandGain.connect(sw); sw.connect(conv);
  ns.start();
  // Ambient soundscape layers, all procedurally generated noise
  const noise = type => {
    const len = ac.sampleRate * 4, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    let l = 0, b0 = 0, b1 = 0, b2 = 0, amp = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;

const motes = Array.from({ length: 46 }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.3 + 0.3,
  vx: (Math.random() - 0.5) * 0.12, vy: -Math.random() * 0.15 - 0.02, ph: Math.random() * TAU }));

const BREATHS = {
  calm:  [['b_in', 4], ['b_hold', 2], ['b_out', 6]],
  box:   [['b_in', 4], ['b_hold', 4], ['b_out', 4], ['b_hold', 4]],
  relax: [['b_in', 4], ['b_hold', 7], ['b_out', 8]],
  even:  [['b_in', 5], ['b_out', 5]],

let breathOn = false, breathT0 = 0, lastLabel = '', lastCount = -1, breathScale = 0.5;
function toggleBreath(force) {
  breathOn = typeof force === 'boolean' ? force : !breathOn; breathT0 = performance.now(); lastLabel = ''; lastCount = -1;
  breathEl.classList.toggle('on', breathOn); $('#breathBtn').classList.toggle('on', breathOn);
}
function updateBreath(now) {
  if (!breathOn) return;
  const ph = BREATHS[prefs.breath] || BREATHS.calm, total = ph.reduce((s, p) => s + p[1], 0);
  let s = ((now - breathT0) / 1000) % total, i = 0;
  while (s >= ph[i][1]) { s -= ph[i][1]; i++; }
  const [key, dur] = ph[i], e = 0.5 - 0.5 * Math.cos(Math.PI * s / dur);
  if (key === 'b_in') breathScale = 0.5 + 0.5 * e;
  else if (key === 'b_out') breathScale = 1 - 0.5 * e;
  else breathScale = i > 0 && ph[i - 1][0] === 'b_out' ? 0.5 : 1;
  orb.style.transform = `scale(${breathScale})`;
  const count = Math.ceil(dur - s);
  if (count !== lastCount) { lastCount = count; $('#breathCount').textContent = count; }
  if (key + i !== lastLabel) { lastLabel = key + i; breathText.style.opacity = 0; setTimeout(() => { breathText.textContent = t(key); breathText.style.opacity = 1; }, 300); }
}

const stats = Object.assign({ minutes: 0, sessions: 0, worries: 0, bubbles: 0, stars: 0, lanterns: 0, days: [] }, store.get('stats', {}));

}

const dayOfYear = () => Math.floor((Date.now() - new Date(new Date().getFullYear(), 0, 0)) / 864e5);

let moments = store.get('moments', []);

const TIMER_MINS = [1, 3, 5, 10, 15, 20, 30], ARC = 56.55;
const timer = {
  running: false, end: 0, dur: 0, min: 0, lastSec: -1,
  start(min) {
    this.min = min; this.dur = min * 60000; this.end = performance.now() + this.dur; this.running = true; this.lastSec = -1;
    bowl(); toast('t_timer', { n: min }); closeAll(); $('#timerBtn').classList.add('on'); renderTimerChips();
  },
  stop(silent) {
    this.running = false; $('#timerArc').style.strokeDashoffset = ARC; $('#timerLbl').textContent = ''; $('#timerBtn').classList.remove('on');
    if (!silent) toast('t_timerStop');
    renderTimerChips();
  },
  tick(now) {
    if (!this.running) return;
    const rem = Math.max(0, this.end - now), sec = Math.ceil(rem / 1000);
    if (sec !== this.lastSec) {
      this.lastSec = sec;
      $('#timerLbl').textContent = `${(sec / 60) | 0}:${String(sec % 60).padStart(2, '0')}`;
      $('#timerArc').style.strokeDashoffset = (ARC * (1 - rem / this.dur)).toFixed(2);
    }
    if (rem <= 0) {
      this.stop(true); bowl(); setTimeout(() => bowl(261.63), 2200); toast('t_timerDone', null, true);
      document.body.classList.add('glow'); setTimeout(() => document.body.classList.remove('glow'), 3500);
    }
  }
};

/* =================== Dream mode (the app plays by itself) =================== */
const dream = {
  on: false, nextPress: 0, pressEnd: 0, lastClear: 0, lastSpace: 0, seed: Math.random() * 100,
  toggle(force) {
    const on = typeof force === 'boolean' ? force : !this.on;
    if (on === this.on || !introDone) return;
    if (on) { closeAll(); toast('t_dreamOn', null, true); this.on = true; const n = performance.now(); this.lastClear = this.lastSpace = n; this.nextPress = n + 900; }
    else { if (pointer.ghost) this.release(); this.on = false; toast('t_dreamOff'); }
    document.body.classList.toggle('dreaming', this.on); $('#autoBtn').classList.toggle('on', this.on);
  },
  pos(now) {
    const s = now / 1000 * 0.9 + this.seed;
    return [vw * (0.5 + 0.38 * Math.sin(s * 0.31) * Math.cos(s * 0.17 + 1)), vh * (0.5 + 0.34 * Math.sin(s * 0.23 + 2) * Math.cos(s * 0.11))];
  },
  press(x, y) { pointer.ghost = true; pointer.down = true; pointer.fresh = true; pointer.x = pointer.lx = x; pointer.y = pointer.ly = y; pointer.pressure = 1; actDown(x, y, true); },
  release() { pointer.ghost = false; endStroke(); },
  tick(now) {
    if (!this.on) return;
    const [x, y] = this.pos(now);
    if (pointer.ghost) { pointer.x = x; pointer.y = y; if (now > this.pressEnd) { this.release(); this.nextPress = now + rnd(500, 2200); } return; }
    if (now - this.lastSpace > 140000) {
      this.lastSpace = this.lastClear = now;
      setActivity(ACTS[(ACTS.indexOf(activity) + 1) % ACTS.length]);
      if (Math.random() < 0.5) setPalette(PALETTES[(Math.random() * PALETTES.length) | 0]);
      return;
    }
    if (now - this.lastClear > 60000) { this.lastClear = now; letGo(); this.nextPress = now + 4000; return; }
    if (now < this.nextPress) return;
    const r = Math.random();
    if (activity === 'sand') { setMode(r < 0.55 ? 'drift' : r < 0.8 ? 'sketch' : 'pour'); if (Math.random() < 0.15) { symmetry = SYMS[(Math.random() * SYMS.length) | 0]; updateSymLabel(); } }
    if (activity === 'garden') setTool(r < 0.12 ? 'stone' : 'rake');
    if (activity === 'night') setNTool(r < 0.25 ? 'lantern' : 'star');
    const dur = { sand: rnd(1500, 4500), water: 80, garden: rnd(2000, 4500), bubbles: rnd(500, 1800), night: r < 0.25 ? 80 : rnd(1500, 3500) }[activity];
    this.press(x, y); this.pressEnd = now + dur;
  }
};

/* =================== Command palette =================== */
let cmdItems = [], cmdSel = 0;
function commands() {
  const L = [], add = (label, run, key = '') => L.push({ label, run, key });
  ACTS.forEach(a => add(t('c_space', { x: t('tab_' + a) }), () => setActivity(a), '← →'));
  add(t('c_letgo'), letGo, 'C'); add(t('c_undo'), undo, 'Ctrl Z'); add(t('c_save'), save, 'S');
  add(t('c_breath'), () => toggleBreath(), 'B'); add(t('c_sound'), () => setSound(!soundOn), 'N'); add(t('c_auto'), () => dream.toggle(), 'D');
  add(t('c_wave'), () => wave.toggle(), 'W'); add(t('c_blow'), () => blow.toggle(), 'L'); add(t('c_fs'), toggleFs, 'F');
  add(t('c_hide'), () => document.body.classList.toggle('ui-hidden'), 'H'); add(t('c_menu'), () => openDrawer('journey'), 'J');
  add(t('d_settings'), () => openDrawer('settings')); add(t('c_keys'), openKeys, '?');
  TIMER_MINS.forEach(n => add(t('c_timer', { n }), () => timer.start(n)));
  PALETTES.forEach(p => add(t('c_palette', { x: p.name }), () => setPalette(p, true)));
  Object.keys(BREATHS).forEach(k => add(`${t('d_breath')}: ${t('br_' + k)}`, () => setBreath(k)));
  LANGS.forEach(([c, n]) => add(`${t('d_language')}: ${n}`, () => setLang(c)));
  return L;
}
function openCmd() { closeAll(); cmdModal.classList.add('open'); const i = $('#cmdInput'); i.value = ''; i.placeholder = t('cmd_ph'); cmdSel = 0; renderCmd(); setTimeout(() => i.focus(), 40); }
function renderCmd() {
  const q = $('#cmdInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean), list = $('#cmdList');
  cmdItems = commands().filter(c => q.every(w => c.label.toLowerCase().includes(w)));
  cmdSel = clamp(cmdSel, 0, Math.max(0, cmdItems.length - 1));
  list.innerHTML = '';
  if (!cmdItems.length) { list.innerHTML = `<div class="cmd"><span>${t('cmd_none')}</span></div>`; return; }
  cmdItems.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'cmd' + (i === cmdSel ? ' sel' : '');
    d.innerHTML = `<span></span>${c.key ? `<small>${c.key}</small>` : ''}`; d.firstChild.textContent = c.label;
    d.addEventListener('mousemove', () => { if (cmdSel !== i) { cmdSel = i; list.querySelectorAll('.cmd').forEach((x, j) => x.classList.toggle('sel', j === i)); } });
    d.addEventListener('click', () => runCmd(c));
    list.appendChild(d);
  });
}
function runCmd(c) { closeAll(); c.run(); }
$('#cmdInput').addEventListener('input', () => { cmdSel = 0; renderCmd(); });
$('#cmdInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); e.stopPropagation(); if (!cmdItems.length) return;
    cmdSel = (cmdSel + (e.key === 'ArrowDown' ? 1 : cmdItems.length - 1)) % cmdItems.length;
    const els = $('#cmdList').querySelectorAll('.cmd'); els.forEach((x, j) => x.classList.toggle('sel', j === cmdSel)); els[cmdSel].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); if (cmdItems[cmdSel]) runCmd(cmdItems[cmdSel]); }

function actDown(x, y, ghost) {
  if (activity === 'water') water.down(x, y);
  else if (activity === 'garden') garden.down(x, y);
  else if (activity === 'bubbles') bub.down(x, y);
  else if (activity === 'night') night.down(x, y);
  else if (!ghost) snapshotSand();
}
fx.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (dream.on) { dream.toggle(false); return; }
  fx.setPointerCapture(e.pointerId);
  pointer.down = true; pointer.fresh = true; pointer.type = e.pointerType;
  pointer.x = pointer.lx = e.clientX; pointer.y = pointer.ly = e.clientY;
  pointer.pressure = e.pointerType === 'pen' ? 0.3 + e.pressure * 1.2 : 1;
  document.body.classList.add('immersed'); if (anyOpen()) closeAll();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  actDown(e.clientX, e.clientY);
});

  if (dream.on) return;
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.type = e.pointerType;

addEventListener('keydown', e => {
  wake();
  if (!introDone) return;
  const k = e.key, mod = e.metaKey || e.ctrlKey;
  if (dream.on) { if (!['Shift', 'Control', 'Alt', 'Meta'].includes(k)) { e.preventDefault(); dream.toggle(false); } return; }
  if (mod && (k === 'k' || k === 'K')) { e.preventDefault(); isOpen(cmdModal) ? closeAll() : openCmd(); return; }
  if (k === 'Escape') { closeAll(); document.body.classList.remove('ui-hidden'); return; }
  const typing = e.target.matches && e.target.matches('input:not([type=range])');
  if (mod && (k === 'z' || k === 'Z') && !typing) { e.preventDefault(); undo(); return; }
  if (mod || e.altKey || typing || isOpen(cmdModal)) return;
  if (k === '?') { isOpen(keysModal) ? closeAll() : openKeys(); return; }
  if (k === '/') { e.preventDefault(); openCmd(); return; }
  if (e.target.matches && e.target.matches('input[type=range]') && k.startsWith('Arrow')) return;
  if (k === 'ArrowRight' || k === 'ArrowLeft') { const i = ACTS.indexOf(activity); setActivity(ACTS[(i + (k === 'ArrowRight' ? 1 : ACTS.length - 1)) % ACTS.length]); return; }
  if (activity === 'sand') {
    if (k === '1') return setMode('pour'); if (k === '2') return setMode('sketch'); if (k === '3') return setMode('drift');
    if (k === '[') return setSize(brushR - 3); if (k === ']') return setSize(brushR + 3);
    if (k === ' ') { e.preventDefault(); return release(); }
    if (k === 'm' || k === 'M') return cycleSym();
    if (k === 'g' || k === 'G') return turnGravity();
  }
  if (activity === 'garden') { if (k === '1') return setTool('rake'); if (k === '2') return setTool('stone'); }
  if (activity === 'night') { if (k === '1') return setNTool('star'); if (k === '2') return setNTool('lantern'); }
  switch (k) {
    case 'c': case 'C': case 'Backspace': e.preventDefault(); letGo(); break;
    case 's': case 'S': save(); break;
    case 'p': case 'P': setPalette(PALETTES[(PALETTES.indexOf(palette) + 1) % PALETTES.length], true); break;
    case 'b': case 'B': toggleBreath(); break;
    case 'n': case 'N': setSound(!soundOn); break;
    case 'w': case 'W': wave.toggle(); break;
    case 'l': case 'L': blow.toggle(); break;
    case 't': case 'T': toggleTimerPop(); break;
    case 'd': case 'D': dream.toggle(); break;
    case 'f': case 'F': toggleFs(); break;
    case 'j': case 'J': isOpen(drawer) ? closeAll() : openDrawer(); break;
    case 'h': case 'H': document.body.classList.toggle('ui-hidden'); break;
  }
});

function begin(withSound) {
  if (introDone) return;
  introDone = true; $('#intro').classList.add('gone'); setSound(withSound); enableTilt();
  markDay(); bump('sessions');
  seedFrames = 80; setTimeout(() => { $('#intro').remove(); renderLangChips(); }, 1600);
  wake();
}
$('#beginSound').addEventListener('click', () => begin(true));
$('#beginSilent').addEventListener('click', () => begin(false));

/* =================== Loop =================== */
function ringR() {
  if (activity === 'sand') return brushR;
  if (activity === 'water') return 14;
  if (activity === 'garden') return garden.tool === 'rake' ? garden.tines * SPC / 2 + 2 : 26;
  if (activity === 'night') return night.tool === 'star' ? 8 : 12;
  return 0;
}
let lastRing = 0, lastNow = 0, activeMs = 0;
function frame(now) {
  const dt = Math.min(250, now - (lastNow || now)); lastNow = now;
  time = now / 1000; frameNo++;
  dream.tick(now);
  fadeFx();
  const fresh = wave.sample(); blow.read();
  let noise = 0;
  if (activity === 'sand') noise = sandFrame(fresh);
  else if (activity === 'water') noise = water.frame(now, fresh);
  else if (activity === 'garden') noise = garden.frame(now, fresh);
  else if (activity === 'night') noise = night.frame(now, fresh);
  else noise = bub.frame(now, fresh);
  wave.aura();

  const r = ringR();
  if (r !== lastRing) { lastRing = r; brushEl.style.width = brushEl.style.height = r * 2 + 'px'; if (!r) brushEl.classList.remove('show'); }
  pointer.bx += (pointer.x - pointer.bx) * 0.4; pointer.by += (pointer.y - pointer.by) * 0.4;
  brushEl.style.transform = `translate(${pointer.bx - r}px,${pointer.by - r}px) scale(${pointer.down ? 0.86 : 1})`;

  updateBreath(now); updateAudio(noise); timer.tick(now);
  if (introDone) { activeMs += dt; if (activeMs >= 60000) { activeMs -= 60000; bump('minutes'); } }
  requestAnimationFrame(frame);
}
function resize() {
  vw = innerWidth; vh = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
  fx.width = Math.round(vw * dpr); fx.height = Math.round(vh * dpr); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  motesC.width = fx.width; motesC.height = fx.height; mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sandResize();
  if (water.ready) water.resize(); if (garden.ready) garden.resize(); if (bub.ready) bub.resize(); if (night.ready) night.resize();
  moveGliders();
}
resize();
addEventListener('resize', resize);
setPalette(PALETTES[prefs.palette] || PALETTES[0]);
setSize(18);
$('#soundIcon').innerHTML = ICON_OFF;
applyToggles();
applyLang();
setActivity(prefs.activity);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveGliders);
requestAnimationFrame(frame);
})();
</script>
